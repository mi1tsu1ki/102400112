<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>頂會熱詞統計平台</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/element-plus/dist/index.css"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="app" class="container">
      <header>
        <p class="eyebrow">CONFERENCE INSIGHTS</p>
        <h1>頂會熱詞統計平台</h1>
        <p class="subtitle">快速探索近期學術會議中的研究關注焦點。</p>
      </header>

      <el-tabs v-model="activeTab" class="dashboard-tabs" @tab-change="handleTabChange">
        <el-tab-pane label="論文管理" name="papers">
          <el-card shadow="never">
            <div class="toolbar">
              <el-input
                v-model="keyword"
                placeholder="搜尋論文標題或作者"
                clearable
              />
              <el-button type="primary" @click="loadPapers">搜尋</el-button>
              <el-button type="success" @click="crawlDialogVisible = true">
                爬取資料
              </el-button>
            </div>
            <el-table v-loading="loading" :data="filteredPapers" stripe>
              <el-table-column prop="title" label="論文標題" min-width="360" />
              <el-table-column prop="year" label="年份" width="110" sortable />
              <el-table-column prop="authors" label="作者" min-width="260" />
              <el-table-column label="原文" width="100">
                <template #default="scope">
                  <el-link
                    v-if="scope.row.ee"
                    :href="scope.row.ee"
                    target="_blank"
                    type="primary"
                  >查看</el-link>
                  <span v-else class="muted">無連結</span>
                </template>
              </el-table-column>
            </el-table>
            <el-empty v-if="!loading && filteredPapers.length === 0" description="目前沒有論文資料" />
          </el-card>

          <el-dialog v-model="crawlDialogVisible" title="爬取會議論文" width="420px">
            <el-form
              ref="crawlFormRef"
              :model="crawlForm"
              :rules="crawlRules"
              label-position="top"
              @submit.prevent
            >
              <el-form-item label="會議名稱" prop="conference">
                <el-select v-model="crawlForm.conference" placeholder="請選擇會議" class="full-width">
                  <el-option label="CVPR" value="CVPR" />
                  <el-option label="ICCV" value="ICCV" />
                  <el-option label="ECCV" value="ECCV" />
                </el-select>
              </el-form-item>
              <el-form-item label="年份" prop="year">
                <el-select v-model="crawlForm.year" placeholder="請選擇年份" class="full-width">
                  <el-option
                    v-for="year in availableYears"
                    :key="year"
                    :label="String(year)"
                    :value="year"
                  />
                </el-select>
              </el-form-item>
            </el-form>
            <template #footer>
              <el-button @click="crawlDialogVisible = false" :disabled="crawlLoading">
                取消
              </el-button>
              <el-button type="primary" :loading="crawlLoading" @click="submitCrawl">
                開始爬取
              </el-button>
            </template>
          </el-dialog>
        </el-tab-pane>

        <el-tab-pane label="熱門圖譜" name="graph">
          <el-card shadow="never">
            <div class="panel-heading">
              <div>
                <h2>關鍵詞共現圖譜</h2>
                <p>節點大小代表詞頻，連線代表同篇論文中的共同出現。</p>
              </div>
              <el-button @click="loadKeywordGraph">重新載入</el-button>
            </div>
            <div ref="graphContainer" class="chart-container"></div>
          </el-card>
        </el-tab-pane>

        <el-tab-pane label="趨勢動圖" name="racing">
          <el-card shadow="never">
            <div class="panel-heading">
              <div>
                <h2>頂會熱詞排名變化</h2>
                <p>使用模擬資料展示 2022 至 2024 年的排名變化。</p>
              </div>
              <el-button @click="restartRace">重新播放</el-button>
            </div>
            <div ref="racingContainer" class="chart-container"></div>
          </el-card>
        </el-tab-pane>
      </el-tabs>
    </main>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
